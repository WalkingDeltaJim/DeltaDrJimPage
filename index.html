<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0067b8">
<title>吉米大夫常用網頁</title>
<style>
:root{
  --bg:#eef1f4; --surface:#fff; --ink:#15212b; --soft:#5d6b78; --line:#d9e0e6;
  --accent:#0067b8; --accent-soft:color-mix(in srgb,var(--accent) 12%,transparent);
  --radius:10px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1418; --surface:#182026; --ink:#e7edf2; --soft:#8d9ba8; --line:#27323b}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- header ---------- */
header{padding:22px 0 14px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;background:var(--accent);color:#fff;
  display:grid;place-items:center;font-size:21px;font-weight:800;flex:none}
h1{margin:0;font-size:20px;line-height:1.25}
.sub{font-size:13px;color:var(--soft)}
.profiles{display:flex;gap:6px;margin-top:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.profiles::-webkit-scrollbar{display:none}
.profiles button{flex:none;display:flex;align-items:center;gap:7px;padding:6px 13px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13.5px}
.profiles i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.profiles button:hover{border-color:var(--c)}
.profiles button[aria-pressed=true]{background:var(--c);border-color:var(--c);color:#fff}
.profiles button[aria-pressed=true] i{background:#fff}

/* ---------- sticky toolbar ---------- */
.bar{position:sticky;top:0;z-index:20;padding:10px 0;border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px)}
.row{display:flex;gap:8px;align-items:center}
.search{flex:1;min-width:0;position:relative}
.search input{width:100%;height:40px;padding:0 44px 0 14px;border-radius:var(--radius);
  border:1px solid var(--line);background:var(--surface)}
.search input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.search kbd{position:absolute;right:10px;top:9px;font:12px/1 monospace;color:var(--soft);
  border:1px solid var(--line);border-radius:5px;padding:3px 6px;pointer-events:none}
.tool{height:40px;padding:0 13px;border-radius:var(--radius);border:1px solid var(--line);
  background:var(--surface);cursor:pointer;white-space:nowrap}
.tool:hover{border-color:var(--accent)}
.tool[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.edit-only{display:none}
body.editing .edit-only{display:inline-block}
.chips{display:flex;gap:6px;margin-top:9px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:3px 11px;border-radius:999px;border:1px solid transparent;background:transparent;
  color:var(--soft);cursor:pointer;font-size:13px}
.chip:hover{color:var(--ink)}
.chip[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}

/* ---------- directory rows ---------- */
main{padding:6px 0 30px}
.group{display:grid;grid-template-columns:132px 1fr;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.group:last-child{border-bottom:0}
.group h2{margin:0;font-size:14px;font-weight:700;padding-top:9px;line-height:1.3}
.group h2 small{display:block;font-weight:400;color:var(--soft);font-size:12px;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:8px}
body.detail .grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.group.fav h2{color:var(--accent)}

.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.tile:hover{border-color:var(--accent)}
.hit{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 6px;min-height:42px;color:inherit;text-decoration:none}
.ic{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent);font-size:16px;font-weight:700}
.tx{min-width:0}
.tx b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx small{display:none;color:var(--soft);font-size:12.5px;line-height:1.35;margin-top:1px}
body.detail .tx small{display:block}
body.detail .hit{padding:9px 10px 9px 9px}
.count{margin-left:auto;font-size:11.5px;color:var(--soft);padding-left:4px}
.ed{position:absolute;top:50%;right:4px;transform:translateY(-50%);display:none;gap:2px;
  background:var(--surface);border-radius:8px}
body.editing .ed{display:flex}
.ed button{border:0;background:none;cursor:pointer;padding:4px 5px;border-radius:6px;font-size:13px}
.ed button:hover{background:var(--accent-soft)}
body.editing .tile{cursor:grab;border-style:dashed}
body.editing .tile.over{border-color:var(--accent);background:var(--accent-soft)}
.openall{margin-top:6px;padding:3px 10px;border-radius:999px;border:1px solid var(--accent);background:transparent;
  color:var(--accent);font-size:12.5px;font-weight:600;cursor:pointer;display:block}
.openall:hover{background:var(--accent);color:#fff}
.group h2 .openall{margin-top:0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:9px 16px;border-radius:999px;font-size:13.5px;z-index:50;max-width:92vw}
.empty{padding:50px 0;text-align:center;color:var(--soft)}

/* ---------- WebSpace ---------- */
details.ws{margin:4px 0 30px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.ws summary{cursor:pointer;padding:13px 16px;font-weight:600;list-style:none;display:flex;gap:8px;align-items:baseline}
details.ws summary::-webkit-details-marker{display:none}
details.ws summary small{font-weight:400;color:var(--soft)}
.ws-body{padding:0 16px 16px;display:grid;gap:10px}
.ws-body label{font-size:13px;color:var(--soft);display:block;margin-bottom:3px}
.ws-body input,.ws-body textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.ws-body textarea{min-height:110px;resize:vertical}
.ws-actions{display:flex;gap:8px}
.btn{padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.6;cursor:wait}
.rec{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg)}
.rec-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rec-h b{word-break:break-all}.rec-h small{color:var(--soft);display:block}
.rec pre{margin:8px 0 0;white-space:pre-wrap;word-break:break-word;font:13px/1.5 inherit;max-height:180px;overflow:auto}
.rec button{border:0;background:none;color:var(--soft);cursor:pointer}
.rec button:hover{color:#d33}
.note{color:var(--soft);font-size:13px}

footer{padding:6px 0 34px;color:var(--soft);font-size:12.5px;text-align:center}

/* ---------- dialog ---------- */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:20px;width:min(440px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 12px}
dialog label{display:block;font-size:13px;color:var(--soft);margin:10px 0 3px}
dialog input[type=text],dialog select,dialog textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
dialog .chk{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px}
dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

@media (max-width:720px){
  .wrap{padding:0 14px}
  .group{grid-template-columns:1fr;gap:8px;padding:12px 0}
  .group h2{padding-top:0;display:flex;gap:8px;align-items:baseline}
  .group h2 small{margin:0}
  .grid,body.detail .grid{grid-template-columns:repeat(2,1fr)}
  body.detail .grid{grid-template-columns:1fr}
  .search kbd{display:none}
  .tool .lbl{display:none}
}
@media (prefers-reduced-motion:no-preference){
  .tile{transition:border-color .12s}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">Δ</div>
      <div>
        <h1 id="title">吉米大夫常用網頁</h1>
        <div class="sub" id="subtitle"></div>
      </div>
    </div>
    <nav class="profiles" id="profiles" aria-label="切換身分"></nav>
  </header>
</div>

<div class="bar">
  <div class="wrap">
    <div class="row">
      <div class="search">
        <input id="q" type="search" placeholder="搜尋網站，按 Enter 直接開啟第一個結果" autocomplete="off">
        <kbd>/</kbd>
      </div>
      <button class="tool" id="bgBtn" aria-pressed="true" title="開啟網站時留在本頁（在背景分頁開啟）">⤵<span class="lbl"> 背景開啟</span></button>
      <button class="tool" id="detailBtn" aria-pressed="false" title="顯示或隱藏說明">☰<span class="lbl"> 說明</span></button>
      <button class="tool" id="editBtn" aria-pressed="false" title="編輯、排序、新增">✏️<span class="lbl"> 編輯</span></button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="row edit-only" id="editTools" style="margin-top:9px;flex-wrap:wrap">
      <button class="tool edit-only" id="addBtn">＋ 新增網站</button>
      <button class="tool edit-only" id="exportBtn">⬇ 匯出備份</button>
      <button class="tool edit-only" id="importBtn">⬆ 匯入備份</button>
      <button class="tool edit-only" id="resetBtn">↺ 還原預設</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>
  </div>
</div>

<div class="wrap">
  <main id="app"></main>

  <details class="ws" id="ws">
    <summary>📝 WebSpace <small>檔案名稱與內容紀錄（儲存於 Google Sheet）</small></summary>
    <div class="ws-body">
      <div><label for="wsName">檔案名稱</label><input id="wsName" type="text" placeholder="例如：Aortic_Dissection_20260829.html"></div>
      <div><label for="wsText">內容</label><textarea id="wsText" placeholder="輸入或貼上內容"></textarea></div>
      <div class="ws-actions">
        <button class="btn primary" id="wsSave">儲存紀錄</button>
        <button class="btn" id="wsClear">清除</button>
      </div>
      <div><label for="wsFind">搜尋紀錄</label><input id="wsFind" type="text" placeholder="搜尋檔案名稱或內容"></div>
      <div id="wsList"></div>
    </div>
  </details>
</div>

<footer>拖曳排序與新增的網站只存在這個瀏覽器，可用「匯出備份」帶到其他瀏覽器。<br>© 2026 Jimmy Doctor</footer>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h3 id="dlgTitle">新增網站</h3>
    <label for="fTitle">名稱</label><input type="text" id="fTitle" required>
    <label for="fUrl">網址</label><input type="text" id="fUrl" placeholder="https://" required>
    <label for="fDesc">說明（選填）</label><input type="text" id="fDesc">
    <label for="fIcon">圖示（一個符號或字母）</label><input type="text" id="fIcon" maxlength="3" placeholder="📌">
    <label for="fCat">分類</label><select id="fCat"></select>
    <label class="chk" style="margin-top:12px"><input type="checkbox" id="fOnly"> 只顯示在目前身分</label>
    <div class="actions">
      <button class="btn" type="button" id="fCancel">取消</button>
      <button class="btn primary" type="submit">儲存</button>
    </div>
  </form>
</dialog>

<script>
/* =========================================================
   Data
========================================================= */
const PROFILES = [
  { id:"jimmy",  name:"吉米大夫",     title:"吉米大夫常用網頁",       sub:"AI、醫療、工作與生活的常用入口", color:"#0067b8" },
  { id:"delta",  name:"載塔駐廠",     title:"載塔駐廠常用網頁",       sub:"廠區臨場服務與日常工具",         color:"#0f766e" },
  { id:"cgu",    name:"我的對的學堂", title:"我的對的學堂常用網頁",   sub:"教學、研究與學校信箱",           color:"#7c3aed" },
  { id:"ntsu",   name:"我的好學堂",   title:"我的好學堂常用網頁",     sub:"教學與研究入口",                 color:"#ea580c" },
  { id:"med",    name:"白房子醫用",   title:"我的白房子醫用常用網頁", sub:"塑膠醫療體系、臨床雲端與醫療資訊", color:"#dc2626" },
  { id:"admin",  name:"白房子行政",   title:"我的白房子行政常用網頁", sub:"塑膠醫療體系行政與通訊",         color:"#4338ca" }
];
const CATS = [
  { id:"ai",     name:"AI 人工智慧",   hint:"對話・研究・寫作", icon:"🤖" },
  { id:"clinic", name:"臨床與健康",    hint:"查證・排班・報備", icon:"🩺" },
  { id:"cgmh",   name:"塑膠體系",      hint:"雲端・學習・通訊", icon:"🏥" },
  { id:"mail",   name:"信箱",          hint:"",                 icon:"✉️" },
  { id:"work",   name:"工作與開發",    hint:"筆記・Office・程式", icon:"🗂️" },
  { id:"web",    name:"資訊與社群",    hint:"新聞・影音・股市", icon:"🌐" }
];
const DEFAULTS = [
  { id:"chatgpt",  c:"ai", t:"ChatGPT",    d:"寫作、研究、分析、程式設計", u:"https://chatgpt.com/", i:"◎", star:1 },
  { id:"claude",   c:"ai", t:"Claude",     d:"長文、推理與文件處理", u:"https://claude.ai/", i:"C", star:1 },
  { id:"grok",     c:"ai", t:"Grok",       d:"即時資訊與推理", u:"https://grok.com/", i:"X" },
  { id:"gemini",   c:"ai", t:"Gemini",     d:"問答、研究、規劃與學習", u:"https://gemini.google.com/", i:"✦" },
  { id:"perplexity", c:"ai", t:"Perplexity AI", d:"附出處的 AI 搜尋與研究", u:"https://www.perplexity.ai/", i:"P" },
  { id:"notebook", c:"ai", t:"NotebookLM", d:"用自己的文件做研究與筆記", u:"https://notebooklm.google.com/", i:"▤" },
  { id:"writeai",  c:"ai", t:"寫作 AI 工具專區", d:"Perplexity、Gamma、Napkin AI、ElevenLabs 等", u:"AITopic/WritingAIPorta.html", i:"✍️" },

  { id:"clintool", c:"clinic", t:"臨床工具集", d:"急診醫學計算機與處置指引", u:"https://cgmherlink-hub.github.io/ClinicalTool/", i:"🩺", star:1 },
  { id:"report",   c:"clinic", t:"廠區報備",   d:"臨場健康服務與報備資料管理", u:"https://cgmherlink-hub.github.io/ReportData/", i:"📋" },
  { id:"utd",      c:"clinic", t:"UpToDate",   d:"臨床醫學實證資料庫", u:"https://www.uptodate.com", i:"📚", star:1 },
  { id:"emyway",   c:"clinic", t:"EmyWay",     d:"大夫行事曆與排班系統", u:"https://emyway.jct.org.tw/calendar/#/fc", i:"📅", star:1 },
  { id:"clinicalkey", c:"clinic", t:"ClinicalKey", d:"臨床醫學資料庫・登入帳號為信箱（email）", u:"https://www.clinicalkey.com/#!/", i:"🔑" },
  { id:"dhealth",  c:"clinic", t:"Delta Health Page", d:"健康資訊與醫療資源入口", u:"DeltaHealth.html", i:"❤️" },
  { id:"vital",    c:"clinic", t:"粒粒生技",   d:"產品介紹與保健資訊", u:"https://sites.google.com/view/vitalgrans/home?authuser=0", i:"🌾" },

  { id:"cloud",    c:"cgmh", t:"塑膠雲端",   d:"塑膠紀念白房子雲端服務", u:"https://cloud.cgmh.org.tw/", i:"🏥", star:1 },
  { id:"learn",    c:"cgmh", t:"塑膠學習網", d:"數位學習與課程平台", u:"https://llg.cgmh.org.tw/", i:"🎓" },
  { id:"msg",      c:"cgmh", t:"塑膠即時通", d:"體系內部即時通訊", u:"https://cghmesg.cgmh.org.tw/", i:"💬" },

  { id:"gmail",    c:"mail", t:"Gmail",           d:"Google 電子郵件", u:"https://mail.google.com/mail/u/0/#inbox", i:"✉️", star:1 },
  { id:"hinet",    c:"mail", t:"Hinet 信箱",      d:"中華電信 Webmail", u:"https://webmail.hinet.net/", i:"📧" },
  { id:"cgumail",  c:"mail", t:"我的對的學堂信箱", d:"學校電子郵件系統", u:"https://mail01.cgu.edu.tw", i:"📧" },

  { id:"blogger",  c:"work", t:"Blogger",     d:"吉米大夫部落格文章管理", u:"https://www.blogger.com/blog/posts/8498723086197321217", i:"B" },
  { id:"evernote", c:"work", t:"Evernote",    d:"筆記、任務與知識管理", u:"https://evernote.com/", i:"E" },
  { id:"office",   c:"work", t:"Microsoft 365", d:"Word、Excel、PowerPoint、Outlook、OneDrive", u:"https://www.office.com/", i:"▦" },
  { id:"github",   c:"work", t:"GitHub",      d:"個人主頁專案原始碼", u:"https://github.com/DeltaOnDutyDoctor/DrDeltaChenHomePage", i:"🐙" },
  { id:"browsers", c:"work", t:"Portable Browsers", d:"免安裝可攜式瀏覽器下載", u:"BrowserDownload/PortableBrowserDownload.html", i:"🌐" },
  { id:"wayground", c:"work", t:"Wayground", d:"互動式測驗與課堂教學平台（管理探索頁）", u:"https://wayground.com/explore/admin", i:"🎯" },

  { id:"fb",       c:"web", t:"Facebook",    d:"貼文、訊息、社團與粉絲專頁", u:"https://www.facebook.com/", i:"f" },
  { id:"yt",       c:"web", t:"YouTube",     d:"醫學教育、演講與新聞", u:"https://www.youtube.com/", i:"▶" },
  { id:"yahoo",    c:"web", t:"Yahoo! 奇摩", d:"新聞、氣象與生活資訊", u:"https://tw.yahoo.com/", i:"Y!" },
  { id:"stock",    c:"web", t:"Yahoo! 股市", d:"台股、美股與財經新聞", u:"https://tw.stock.yahoo.com/", i:"📈" }
];
const WS_API_URL = "https://script.google.com/macros/s/AKfycbx-GzQCysu0nQU0V586ihU6q9JuyHnkniND8v5nsNorKQdUOvhHSQNXqxD-rN11lwT-/exec";

/* =========================================================
   State (localStorage, always guarded)
========================================================= */
const KEY = "jimmy_portal_v3";
const store = {
  get(k, fb){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch(e){ return fb; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const clone = o => JSON.parse(JSON.stringify(o));
const saved = store.get(KEY, null);
/* Newly added default sites are appended to existing saved lists once (deleted ones stay deleted). */
const seen = new Set(saved && saved.seen ? saved.seen : DEFAULTS.map(c => c.id).filter(id => id !== "wayground"));
const initialCards = saved && Array.isArray(saved.cards) ? saved.cards : clone(DEFAULTS);
if (saved) DEFAULTS.forEach(d => { if (!seen.has(d.id) && !initialCards.some(c => c.id === d.id)) initialCards.push(clone(d)); });
const S = {
  cards:  initialCards,
  clicks: saved && saved.clicks ? saved.clicks : {},
  profile: "jimmy",
  cat: "",
  q: "",
  editing: false,
  detail: !!store.get("jimmy_portal_detail", false),
  bg: store.get("jimmy_portal_bg", true)
};
const persist = () => store.set(KEY, { cards:S.cards, clicks:S.clicks, seen:DEFAULTS.map(c => c.id) });
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const $ = id => document.getElementById(id);
const profile = () => PROFILES.find(p => p.id === S.profile) || PROFILES[0];

/* =========================================================
   Profiles
========================================================= */
function setProfile(id, push){
  if (!PROFILES.some(p => p.id === id)) id = "jimmy";
  S.profile = id;
  const p = profile();
  document.documentElement.style.setProperty("--accent", p.color);
  document.querySelector('meta[name="theme-color"]').content = p.color;
  document.title = p.title;
  $("title").textContent = p.title;
  $("subtitle").textContent = p.sub;
  store.set("jimmy_portal_profile", id);
  if (push) history.replaceState(null, "", "#" + id);
  renderProfiles();
  render();
}
function renderProfiles(){
  $("profiles").innerHTML = PROFILES.map(p =>
    `<button style="--c:${p.color}" data-p="${p.id}" aria-pressed="${p.id === S.profile}"><i></i>${esc(p.name)}</button>`
  ).join("");
}

/* =========================================================
   Rendering
========================================================= */
const inProfile = c => !c.only || !c.only.length || c.only.includes(S.profile);
const matches = (c, q) => !q || (c.t + " " + (c.d||"") + " " + c.u).toLowerCase().includes(q);
const PINNED = ["gmail"];   // always the first entry in the top row
const clickKey = c => S.profile + ":" + c.id;

function tile(c, opts){
  const n = (opts && opts.badge && S.clicks[clickKey(c)]) || 0;
  return `<div class="tile" data-id="${esc(c.id)}"${S.editing && !(opts && opts.badge) ? ' draggable="true"' : ''}>
    <a class="hit" href="${esc(c.u)}" target="_blank" rel="noopener noreferrer" title="${esc(c.d || c.t)}">
      <span class="ic">${esc(c.i || "🔗")}</span>
      <span class="tx"><b>${esc(c.t)}</b><small>${esc(c.d)}</small></span>
      ${n ? `<span class="count">${n}</span>` : ""}
    </a>
    ${opts && opts.badge ? "" : `<span class="ed"><button data-act="edit" title="編輯">✏️</button><button data-act="del" title="刪除">🗑️</button></span>`}
  </div>`;
}

function render(){
  const q = S.q.trim().toLowerCase();
  const pool = S.cards.filter(inProfile);

  // category chips with counts
  $("chips").innerHTML =
    `<button class="chip" data-cat="" aria-pressed="${S.cat === ""}">全部 ${pool.length}</button>` +
    CATS.map(k => {
      const n = pool.filter(c => c.c === k.id).length;
      return n || S.editing ? `<button class="chip" data-cat="${k.id}" aria-pressed="${S.cat === k.id}">${k.icon} ${k.name} ${n}</button>` : "";
    }).join("");

  let html = "";

  // most-used row: only on the unfiltered view
  if (!q && !S.cat){
    const pinned = PINNED.map(id => pool.find(c => c.id === id)).filter(Boolean);
    const rest = pool.filter(c => !PINNED.includes(c.id));
    let top = rest.filter(c => S.clicks[clickKey(c)]).sort((a,b) => S.clicks[clickKey(b)] - S.clicks[clickKey(a)]);
    const ranked = top.length > 0;
    if (!ranked) top = rest.filter(c => c.star);
    top = pinned.concat(top).slice(0, 8);
    if (top.length) html += `<section class="group fav"><h2>⭐ 常用<small>Gmail 固定在最前，其餘${ranked ? "依點擊次數排序" : "點擊後自動排序"}</small></h2>
      <div class="grid">${top.map(c => tile(c, { badge:true })).join("")}</div></section>`;
  }

  CATS.forEach(k => {
    if (S.cat && S.cat !== k.id) return;
    const list = pool.filter(c => c.c === k.id && matches(c, q));
    if (!list.length && !(S.editing && !q)) return;
    html += `<section class="group" id="cat-${k.id}"><h2><span>${k.icon} ${k.name}${k.hint ? `<small>${k.hint}</small>` : ""}</span>${k.id === "ai" && list.length ? `<button class="openall" data-openall="ai" title="在背景分頁一次開啟全部 AI 網站">全部開啟 ${list.length}</button>` : ""}</h2>
      <div class="grid">${list.map(c => tile(c)).join("")}</div></section>`;
  });

  if (!html || (q && !pool.some(c => matches(c, q)))) html = `<div class="empty">找不到符合的網站，換個關鍵字試試。</div>`;
  $("app").innerHTML = html;
}

/* =========================================================
   Interactions
========================================================= */
function countClick(id){
  const k = S.profile + ":" + id;
  S.clicks[k] = (S.clicks[k] || 0) + 1;
  persist();
}

$("app").addEventListener("click", e => {
  const tileEl = e.target.closest(".tile");
  if (!tileEl) return;
  const id = tileEl.dataset.id;
  const act = e.target.closest("[data-act]");
  if (act){
    e.preventDefault();
    if (act.dataset.act === "edit") openDialog(id);
    if (act.dataset.act === "del" && confirm("確定要刪除這個網站嗎？")){
      S.cards = S.cards.filter(c => c.id !== id); persist(); render();
    }
    return;
  }
  if (S.editing){ e.preventDefault(); return; }
  const hit = e.target.closest(".hit");
  if (hit){
    countClick(id);                                  // re-rank on next render
    const plain = e.button === 0 && !e.ctrlKey && !e.metaKey && !e.shiftKey && !e.altKey;
    if (S.bg && plain){ e.preventDefault(); openBg(hit.href); }
  }
});
$("app").addEventListener("click", e => {
  const b = e.target.closest("[data-openall]"); if (!b || S.editing) return;
  const list = S.cards.filter(c => inProfile(c) && c.c === b.dataset.openall);
  list.forEach(c => { countClick(c.id); openBg(new URL(c.u, location.href).href); });
  toast(`已在背景開啟 ${list.length} 個網站`);
});
$("app").addEventListener("auxclick", e => {
  const t = e.target.closest(".tile");
  if (t && !S.editing && e.button === 1) countClick(t.dataset.id);
});

/* Open in a background tab: a synthetic Ctrl/Cmd+click keeps focus on this page (desktop Chrome, Edge, Firefox). */
function openBg(url){
  const a = document.createElement("a");
  a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer"; a.style.display = "none";
  document.body.appendChild(a);
  const mac = /Mac|iPhone|iPad/.test(navigator.platform);
  a.dispatchEvent(new MouseEvent("click", { bubbles:true, cancelable:true, view:window, ctrlKey:!mac, metaKey:mac }));
  a.remove();
}
let toastTimer;
function toast(msg){
  let t = document.querySelector(".toast");
  if (!t){ t = document.createElement("div"); t.className = "toast"; document.body.appendChild(t); }
  t.textContent = msg; clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 3500);
}

/* drag & drop (edit mode only) */
let dragId = null;
$("app").addEventListener("dragstart", e => { const t = e.target.closest(".tile"); if (t){ dragId = t.dataset.id; e.dataTransfer.effectAllowed = "move"; } });
$("app").addEventListener("dragover", e => { const t = e.target.closest(".tile"); if (t && dragId){ e.preventDefault(); t.classList.add("over"); } });
$("app").addEventListener("dragleave", e => { const t = e.target.closest(".tile"); if (t) t.classList.remove("over"); });
$("app").addEventListener("drop", e => {
  e.preventDefault();
  const t = e.target.closest(".tile"), g = e.target.closest(".group");
  if (!dragId) return;
  const from = S.cards.findIndex(c => c.id === dragId);
  const moving = S.cards.splice(from, 1)[0];
  if (t && t.dataset.id !== dragId){
    const to = S.cards.findIndex(c => c.id === t.dataset.id);
    moving.c = S.cards[to].c;
    S.cards.splice(to, 0, moving);
  } else if (g && g.id.startsWith("cat-")){          // dropped on an empty area of a category
    moving.c = g.id.slice(4);
    S.cards.push(moving);
  } else {
    S.cards.splice(from, 0, moving);
  }
  dragId = null; persist(); render();
});
$("app").addEventListener("dragend", () => { dragId = null; render(); });

$("profiles").addEventListener("click", e => { const b = e.target.closest("[data-p]"); if (b) setProfile(b.dataset.p, true); });
$("chips").addEventListener("click", e => {
  const b = e.target.closest("[data-cat]"); if (!b) return;
  S.cat = (S.cat === b.dataset.cat) ? "" : b.dataset.cat; render();
});

$("q").addEventListener("input", e => { S.q = e.target.value; render(); });
$("q").addEventListener("keydown", e => {
  if (e.key === "Enter"){
    const a = document.querySelector("#app .group:not(.fav) .hit") || document.querySelector("#app .hit");
    if (a && S.q.trim()){ countClick(a.closest(".tile").dataset.id); window.open(a.href, "_blank", "noopener"); }
  }
  if (e.key === "Escape"){ e.target.value = ""; S.q = ""; render(); e.target.blur(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ e.preventDefault(); $("q").focus(); }
});

$("bgBtn").addEventListener("click", () => {
  S.bg = !S.bg; store.set("jimmy_portal_bg", S.bg);
  $("bgBtn").setAttribute("aria-pressed", S.bg);
  toast(S.bg ? "背景開啟：點網站會在背景分頁開啟，畫面留在這裡" : "一般開啟：點網站會直接跳到新分頁");
});
$("detailBtn").addEventListener("click", () => {
  S.detail = !S.detail; store.set("jimmy_portal_detail", S.detail);
  document.body.classList.toggle("detail", S.detail);
  $("detailBtn").setAttribute("aria-pressed", S.detail);
});
$("editBtn").addEventListener("click", () => {
  S.editing = !S.editing;
  document.body.classList.toggle("editing", S.editing);
  $("editBtn").setAttribute("aria-pressed", S.editing);
  $("editTools").style.display = S.editing ? "flex" : "none";
  render();
});
$("editTools").style.display = "none";

/* ---- add / edit dialog ---- */
let editingId = null;
$("fCat").innerHTML = CATS.map(k => `<option value="${k.id}">${k.icon} ${k.name}</option>`).join("");
function openDialog(id){
  editingId = id || null;
  const c = id ? S.cards.find(x => x.id === id) : null;
  $("dlgTitle").textContent = c ? "編輯網站" : "新增網站";
  $("fTitle").value = c ? c.t : "";
  $("fUrl").value   = c ? c.u : "";
  $("fDesc").value  = c ? (c.d || "") : "";
  $("fIcon").value  = c ? (c.i || "") : "";
  $("fCat").value   = c ? c.c : (S.cat || "work");
  $("fOnly").checked = c ? !!(c.only && c.only.length) : false;
  $("dlg").showModal();
}
$("addBtn").addEventListener("click", () => openDialog());
$("fCancel").addEventListener("click", () => $("dlg").close());
$("form").addEventListener("submit", e => {
  e.preventDefault();
  let url = $("fUrl").value.trim();
  if (!/:\/\//.test(url) && !/\.html?$/i.test(url)) url = "https://" + url;
  const data = {
    t: $("fTitle").value.trim(), u: url, d: $("fDesc").value.trim(),
    i: $("fIcon").value.trim() || "📌", c: $("fCat").value,
    only: $("fOnly").checked ? [S.profile] : []
  };
  if (editingId) Object.assign(S.cards.find(c => c.id === editingId), data);
  else S.cards.push({ id: "u" + Date.now(), ...data });
  persist(); $("dlg").close(); render();
});

/* ---- reset / backup ---- */
$("resetBtn").addEventListener("click", () => {
  if (!confirm("還原預設網站清單？你新增與排序的內容會被清除，點擊紀錄會保留。")) return;
  S.cards = clone(DEFAULTS); persist(); render();
});
$("exportBtn").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify({ cards:S.cards, clicks:S.clicks }, null, 2)], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "jimmy-portal-backup.json"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
$("importBtn").addEventListener("click", () => $("importFile").click());
$("importFile").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!Array.isArray(d.cards) || !d.cards.every(c => c.id && c.t && c.u && c.c)) throw new Error("格式不符");
      S.cards = d.cards; S.clicks = d.clicks || {}; persist(); render();
    } catch(err){ alert("匯入失敗：" + err.message); }
    e.target.value = "";
  };
  r.readAsText(f);
});

/* =========================================================
   WebSpace (Google Sheet via Apps Script) — loads on first open
========================================================= */
let wsCache = [], wsLoaded = false;
async function wsCall(opts, query){
  const res = await fetch(WS_API_URL + (query || ""), opts);
  const data = await res.json();
  if (!data.success) throw new Error(data.error || "操作失敗");
  return data;
}
async function wsLoad(){
  $("wsList").innerHTML = `<p class="note">讀取中…</p>`;
  try { wsCache = (await wsCall({}, "?action=list")).records; wsLoaded = true; wsRender(); }
  catch(err){ $("wsList").innerHTML = `<p class="note">無法連線至 Google Sheet：${esc(err.message)}</p>`; }
}
function wsRender(){
  const s = $("wsFind").value.trim().toLowerCase();
  const list = wsCache.filter(r => (r.filename + " " + r.content).toLowerCase().includes(s));
  $("wsList").innerHTML = list.length ? list.map(r => `
    <div class="rec"><div class="rec-h"><div><b>📁 ${esc(r.filename)}</b><small>${esc(r.date)}</small></div>
    <button data-del="${esc(r.id)}">刪除</button></div><pre>${esc(r.content)}</pre></div>`).join("")
    : `<p class="note">目前沒有紀錄。</p>`;
}
$("ws").addEventListener("toggle", () => { if ($("ws").open && !wsLoaded) wsLoad(); });
$("wsFind").addEventListener("input", wsRender);
$("wsClear").addEventListener("click", () => { $("wsName").value = ""; $("wsText").value = ""; });
$("wsSave").addEventListener("click", async () => {
  const filename = $("wsName").value.trim(), content = $("wsText").value.trim();
  if (!filename || !content){ alert("請輸入檔案名稱與內容。"); return; }
  const b = $("wsSave"); b.disabled = true; b.textContent = "儲存中…";
  try {
    await wsCall({ method:"POST", body:JSON.stringify({ action:"add", filename, content }) });
    $("wsName").value = ""; $("wsText").value = ""; await wsLoad();
  } catch(err){ alert("儲存失敗：" + err.message); }
  b.disabled = false; b.textContent = "儲存紀錄";
});
$("wsList").addEventListener("click", async e => {
  const id = e.target.dataset.del;
  if (!id || !confirm("確定要刪除這筆紀錄嗎？")) return;
  try { await wsCall({ method:"POST", body:JSON.stringify({ action:"delete", id }) }); await wsLoad(); }
  catch(err){ alert("刪除失敗：" + err.message); }
});

/* =========================================================
   Boot — #delta, #cgu … deep-link straight to a profile
========================================================= */
document.body.classList.toggle("detail", S.detail);
$("detailBtn").setAttribute("aria-pressed", S.detail);
$("bgBtn").setAttribute("aria-pressed", S.bg);
const startId = (location.hash || "").slice(1) || store.get("jimmy_portal_profile", "jimmy");
setProfile(startId, false);
window.addEventListener("hashchange", () => setProfile((location.hash || "").slice(1), false));
</script>
